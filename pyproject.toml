[project]
name = "topout-bench"
version = "0.1.0"
description = "LLMs playing NES Tetris through tool calls: play, replay and per-piece analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "gym-tetris==4.0.0",
    "nes-py==9.0.1",
    "numpy",
    "requests",
    "pillow",
    "huggingface-hub>=2.4.0",
    "dash>=3",
    "waitress>=3.0.2",
    "kaleido>=1.5.2",
    "plotly>=7.2.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
